# FleetPulse — Kafka (KRaft, no ZooKeeper), PostgreSQL and the four services.
# The images are built beforehand with build-images.sh / build-images.ps1 (Jib for the Java services,
# a Dockerfile for the Angular dashboard).
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # client port for apps running on your machine (localhost:9092)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
    environment:
      # --- KRaft: this one node is both broker and controller ---
      KAFKA_NODE_ID: 1
#      The two jobs this server does:
#      broker: stores messages and serves producers and consumers.
#      controller: manages the cluster’s metadata, such as which topics exist, which broker leads each partition, and who is alive. ZooKeeper used to do this job.
#      ==> Doing both in one process is called combined mode. It’s fine for development. In production the controllers usually run separately.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # --- Listeners: 9092 for clients, 9093 for the controller (internal) ---
      # Clients are told the address to reconnect to, so one address cannot serve both worlds:
      # "localhost:9092" works from your machine, but inside the compose network localhost is the
      # client's own container. The extra INTERNAL listener advertises kafka:29092 for the services.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single broker: internal topics cannot have more than 1 replica ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # --- Learning-friendly settings ---
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0   # consumers get partitions immediately (default waits 3 s)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"    # forces you to create topics explicitly, with the partition count you chose

  # PostgreSQL — stores processed event IDs for idempotency in processing-service.
  # Why PostgreSQL and not Redis:
  #   PostgreSQL gives you durable, ACID-compliant storage with a unique constraint.
  #   A duplicate insert simply throws a constraint-violation exception — no extra logic needed.
  #   Redis is faster (in-memory key-value store) and would work too, but it adds a second
  #   infrastructure concept to explain. For a CV project, PostgreSQL is the safer choice:
  #   it is the most common database in Spring Boot stacks and every interviewer recognizes it.
  #   Use Redis if you need sub-millisecond deduplication at very high throughput
  #   or if you already have Redis in the stack for caching.
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5433:5432"   # 5432 is taken by a local PostgreSQL installation; app connects on 5433
    environment:
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetpulse -d fleetpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The services reach Kafka and PostgreSQL by container name. Environment variables override the
  # localhost values in each application.yml (SPRING_KAFKA_BOOTSTRAP_SERVERS -> spring.kafka.bootstrap-servers).

  # Declares the topics at startup, so it must be up before the consumers need them.
  ingestion-service:
    image: fleetpulse/ingestion-service
    container_name: ingestion-service
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  processing-service:
    image: fleetpulse/processing-service
    container_name: processing-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleetpulse   # container port, not the 5433 mapped to your machine
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ingestion-service:
        condition: service_started

  live-service:
    image: fleetpulse/live-service
    container_name: live-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      ingestion-service:
        condition: service_started

  simulator-service:
    image: fleetpulse/simulator-service
    container_name: simulator-service
    environment:
      SIMULATOR_INGESTION_URL: http://ingestion-service:8081
    depends_on:
      - ingestion-service

  # The dashboard: nginx serves the Angular app and proxies /api to live-service (see dashboard/nginx.conf).
  dashboard:
    image: fleetpulse/dashboard
    container_name: dashboard
    ports:
      - "4200:80"
    depends_on:
      - live-service