<header class="head">
  <h2 class="card-title">Vehicles <span class="count">{{ rows().length }}</span></h2>

  <div class="tools">
    @if (activeFilterLabel(); as label) {
      <button type="button" class="clear" (click)="store.setStatusFilter('ALL')">Showing: {{ label }} · clear</button>
    }
    <label class="search">
      <span class="sr-only">Search vehicles</span>
      <input type="search" placeholder="Search vehicle" [value]="search()" (input)="onSearch($event)" />
    </label>
  </div>
</header>

<div class="scroll">
  <table>
    <thead>
      <tr>
        <th scope="col">Vehicle</th>
        <th scope="col">Status</th>
        <th scope="col">Speed</th>
        <th scope="col">Position</th>
        <th scope="col">Last seen</th>
      </tr>
    </thead>
    <tbody>
      @for (v of rows(); track v.vehicleId) {
        <tr [class.selected]="store.selectedId() === v.vehicleId" (click)="store.select(v.vehicleId)">
          <td><button type="button" class="link">{{ v.vehicleId }}</button></td>
          <td><app-status-pill [status]="v.status" /></td>
          <td class="speed">
            <span class="num">{{ v.speedKmh.toFixed(0) }} km/h</span>
            <span [class]="'bar ' + v.status" aria-hidden="true">
              <span class="fill" [style.width.%]="barWidth(v.speedKmh)"></span>
              <span class="limit" [style.left.%]="limitPosition"></span>
            </span>
          </td>
          <td class="muted">{{ v.lat.toFixed(3) }}, {{ v.lon.toFixed(3) }}</td>
          <td class="muted">{{ ago(v.lastSeen, store.now()) }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="empty">No vehicle matches</td>
        </tr>
      }
    </tbody>
  </table>
</div>
