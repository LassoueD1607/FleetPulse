server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to this server. /api/* is forwarded to live-service with the prefix
    # removed, so the frontend needs no CORS configuration and no knowledge of the backend address.
    location /api/ {
        proxy_pass http://live-service:8083/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Server-Sent Events: without these, nginx would hold the stream back in a buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
